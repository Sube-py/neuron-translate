[project]
name = "trans"
version = "0.1.0"
description = "Translation service on Cloudflare Workers AI with AI Gateway tracing"
readme = "README.md"
license = "MIT"
authors = [
    { name = "zhangluguang" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "workers-py>=0.6",
    "workers-runtime-sdk>=0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
